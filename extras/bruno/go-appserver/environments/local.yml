name: local
variables:
  - name: baseUrl
    value: http://localhost:8080
  - name: keycloakUrl
    value: http://localhost:8880
  - name: realm
    value: go
  - name: tokenUrl
    value: "{{keycloakUrl}}/realms/{{realm}}/protocol/openid-connect/token"
  - name: clientId
    value: go-client
  - secret: true
    name: clientSecret
  - name: username
    value: admin
  - name: password
    value: p
