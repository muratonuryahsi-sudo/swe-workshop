info:
  name: Alle Mitglieder
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/mitglied/"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  followRedirects: true
