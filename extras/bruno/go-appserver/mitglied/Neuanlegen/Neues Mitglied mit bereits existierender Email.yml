info:
  name: Neues Mitglied mit bereits existierender Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/mitglied/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "vorname": "Erika",
        "nachname": "Musterfrau",
        "email": "max.mustermann@example.com",
        "geschlecht": "WEIBLICH",
        "mitgliedsstatus": "AKTIV"
      }

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: "[409, 500]"

settings:
  encodeUrl: true
  followRedirects: true
