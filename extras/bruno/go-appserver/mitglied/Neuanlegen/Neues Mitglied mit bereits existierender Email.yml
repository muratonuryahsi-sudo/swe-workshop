info:
  name: Neues Mitglied mit bereits existierender Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{mitgliedUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "vorname": "Erika",
        "nachname": "Musterfrau",
        "email": "max.mustermann@example.com",
        "geschlecht": "WEIBLICH",
        "mitgliedsstatus": "AKTIV"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: "[409, 500]"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
