info:
  name: Neues Mitglied
  type: http
  seq: 1

http:
  method: POST
  url: "{{mitgliedUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "vorname": "Max",
        "nachname": "Mustermann",
        "email": "max.mustermann@example.com",
        "geburtsdatum": "1990-01-15T00:00:00Z",
        "telefonnummer": "0721-123456",
        "geschlecht": "MAENNLICH",
        "mitgliedsstatus": "AKTIV",
        "beitrittsdatum": "2024-03-01T00:00:00Z",
        "interessen": ["Lesen", "Sport"]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
