info:
  name: Neues Mitglied ohne Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{mitgliedUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "vorname": "Kein",
        "nachname": "Token",
        "email": "kein.token@example.com",
        "geschlecht": "MAENNLICH",
        "mitgliedsstatus": "AKTIV"
      }
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
