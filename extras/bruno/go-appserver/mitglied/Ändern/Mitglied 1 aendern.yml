info:
  name: Mitglied 1 aendern
  type: http
  seq: 1

http:
  method: PUT
  url: "{{mitgliedUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "vorname": "Max",
        "nachname": "Mustermann",
        "email": "max.mustermann@example.com",
        "telefonnummer": "0721-999999",
        "geschlecht": "MAENNLICH",
        "mitgliedsstatus": "AKTIV",
        "beitrittsdatum": "2024-01-01T00:00:00Z"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
