info:
  name: Mitglied mit nicht-vorhandener ID
  type: http
  seq: 2

http:
  method: PUT
  url: "{{mitgliedUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "999999"
      type: path
  body:
    type: json
    data: |-
      {
        "vorname": "Max",
        "nachname": "Mustermann",
        "email": "max.mustermann@example.com",
        "geschlecht": "MAENNLICH",
        "mitgliedsstatus": "AKTIV"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
