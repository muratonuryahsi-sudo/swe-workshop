info:
  name: Neuer Ausweis mit ungueltigem Datum
  type: http
  seq: 2

http:
  method: POST
  url: "{{ausweisUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "ausstellungsdatum": "2026-01-01T00:00:00Z",
        "ablaufdatum": "2024-01-01T00:00:00Z",
        "mitglied_id": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  followRedirects: true
