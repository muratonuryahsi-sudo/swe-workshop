info:
  name: Neuer Ausweis ohne MitgliedID
  type: http
  seq: 3

http:
  method: POST
  url: "{{ausweisUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "ausstellungsdatum": "2024-01-01T00:00:00Z",
        "ablaufdatum": "2026-01-01T00:00:00Z"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
