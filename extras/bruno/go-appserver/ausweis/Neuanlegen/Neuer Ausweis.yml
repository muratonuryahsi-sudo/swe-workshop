info:
  name: Neuer Ausweis
  type: http
  seq: 1

http:
  method: POST
  url: "{{ausweisUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "ausstellungsdatum": "2024-01-01T00:00:00Z",
        "ablaufdatum": "2026-01-01T00:00:00Z",
        "mitglied_id": 1
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
