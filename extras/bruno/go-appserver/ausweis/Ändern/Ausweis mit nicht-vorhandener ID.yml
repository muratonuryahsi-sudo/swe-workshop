info:
  name: Ausweis mit nicht-vorhandener ID
  type: http
  seq: 2

http:
  method: PUT
  url: "{{ausweisUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "999999"
      type: path
  body:
    type: json
    data: |-
      {
        "ausstellungsdatum": "2024-06-01T00:00:00Z",
        "ablaufdatum": "2028-06-01T00:00:00Z",
        "mitglied_id": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  followRedirects: true
