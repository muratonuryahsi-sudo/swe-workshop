info:
  name: Neue Ausleihe
  type: http
  seq: 1

http:
  method: POST
  url: "{{ausleiheUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "ausleihdatum": "2024-03-01T00:00:00Z",
        "rueckgabedatum": "2024-03-15T00:00:00Z",
        "mitglied_id": 1
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
