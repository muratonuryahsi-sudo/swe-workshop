info:
  name: Neue Ausleihe mit ungueltigem Datum
  type: http
  seq: 2

http:
  method: POST
  url: "{{ausleiheUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "ausleihdatum": "2024-03-15T00:00:00Z",
        "rueckgabedatum": "2024-03-01T00:00:00Z",
        "mitglied_id": 1
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  followRedirects: true
