info:
  name: Ausleihe 1 aendern
  type: http
  seq: 1

http:
  method: PUT
  url: "{{ausleiheUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "ausleihdatum": "2024-05-01T00:00:00Z",
        "rueckgabedatum": "2024-05-20T00:00:00Z",
        "mitglied_id": 1
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
