info:
  name: Ausleihen von Mitglied 1
  type: http
  seq: 1

http:
  method: GET
  url: "{{ausleiheUrl}}/mitglied/:mitgliedID"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: mitgliedID
      value: "1"
      type: path

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  followRedirects: true
