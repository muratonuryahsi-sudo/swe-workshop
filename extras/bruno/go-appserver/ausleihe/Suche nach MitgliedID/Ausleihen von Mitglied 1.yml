info:
  name: Ausleihen von Mitglied 1
  type: http
  seq: 1

http:
  method: GET
  url: "{{ausleiheUrl}}/mitglied/:mitgliedID"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: mitgliedID
      value: "1"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/json(; charset=utf-8)?$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
