info:
  name: Ausleihe loeschen
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{ausleiheUrl}}/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
