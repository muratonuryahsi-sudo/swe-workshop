info:
  name: Ausleihe mit nicht-vorhandener ID loeschen
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{ausleiheUrl}}/:id"
  params:
    - name: id
      value: "999999"
      type: path

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  followRedirects: true
