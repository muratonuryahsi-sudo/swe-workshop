info:
  name: Token mit falschem Passwort
  type: http
  seq: 3

http:
  method: POST
  url: "{{tokenUrl}}"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: go-client
      - name: client_secret
        value: changeme-go-client-secret
      - name: username
        value: user
      - name: password
        value: FALSCH
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
