info:
  name: Token als user
  type: http
  seq: 2

http:
  method: POST
  url: "{{tokenUrl}}"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"
      - name: username
        value: user
      - name: password
        value: p
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.access_token
      operator: matches
      value: .+\..+\..+

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
