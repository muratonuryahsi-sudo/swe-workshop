name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatierung prüfen (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Nicht formatierte Dateien:"
            echo "$unformatted"
            exit 1
          fi

      - name: Statische Analyse (go vet)
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test ./...
